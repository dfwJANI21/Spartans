    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #f8f9fa;
        color: #202124;
        font-family: 'Google Sans Text', 'Roboto', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      /* Google AI subtle ambient top glow */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 10% 5%, rgba(66, 133, 244, 0.05) 0%, transparent 45%),
                    radial-gradient(circle at 90% 5%, rgba(234, 67, 53, 0.04) 0%, transparent 40%),
                    radial-gradient(circle at 50% 95%, rgba(52, 168, 83, 0.04) 0%, transparent 50%),
                    radial-gradient(circle at 85% 85%, rgba(251, 188, 4, 0.04) 0%, transparent 45%);
        pointer-events: none;
        z-index: 0;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f3f4;
      }
      ::-webkit-scrollbar-thumb {
        background: #dadce0;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bdc1c6;
      }
    </style>
  </head>
